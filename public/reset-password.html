<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور | PHARAOH TALENT</title><style>body{margin:0;background:#07111f;color:#edf4ff;font-family:system-ui,Segoe UI,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(92vw,440px);box-sizing:border-box;padding:28px;border:1px solid #34445c;border-radius:20px;background:#101d30}h1{font-size:1.5rem}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #50617a;font:inherit}input{background:#07111f;color:white}button{margin-top:18px;background:#d6ad55;color:#101827;border:0;font-weight:700;cursor:pointer}p{color:#b8c6da;line-height:1.7}#status{white-space:pre-wrap}</style></head>
<body><main class="card"><h1>إعادة تعيين كلمة المرور</h1><p>اختر كلمة مرور جديدة لا تقل عن 12 حرفًا وتحتوي على حروف وأرقام. رابط الاستعادة صالح لمدة 30 دقيقة.</p><form id="reset"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><button>حفظ كلمة المرور</button></form><p id="status" role="status"></p></main><script src="/reset-password.js" defer></script></body></html>
