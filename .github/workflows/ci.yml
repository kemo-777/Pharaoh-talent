name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check server and browser scripts
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/reset-password.js
          node --check public/verify-email.js
          node --check public/guardian-consent.js
          node --check lib/relational-store.js
      - name: Run automated tests
        run: npm test
